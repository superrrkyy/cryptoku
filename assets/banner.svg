<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14100a"/>
      <stop offset="50%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#120a10"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="55%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c55e" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity=".38"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#bg)"/>
  <circle cx="150" cy="70" r="260" fill="url(#glow)"/>

  <!-- grafik area -->
  <g transform="translate(640 60)">
    <polygon points="0,220 60,190 120,205 180,150 240,170 300,110 360,140 420,80 480,100 540,40 540,240 0,240" fill="url(#area)"/>
    <polyline points="0,220 60,190 120,205 180,150 240,170 300,110 360,140 420,80 480,100 540,40"
      fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="540" cy="40" r="7" fill="#22c55e"/>
    <circle cx="540" cy="40" r="14" fill="none" stroke="#22c55e" stroke-opacity=".35" stroke-width="3">
      <animate attributeName="r" values="10;22;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values=".5;0;.5" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- candlestick -->
  <g transform="translate(60 300)" stroke-linecap="round">
    <g stroke="#22c55e" fill="#22c55e">
      <line x1="10" y1="10" x2="10" y2="60" stroke-width="3"/>
      <rect x="2" y="22" width="16" height="28" rx="3" stroke="none"/>
      <line x1="46" y1="0" x2="46" y2="52" stroke-width="3"/>
      <rect x="38" y="12" width="16" height="26" rx="3" stroke="none"/>
      <line x1="118" y1="6" x2="118" y2="56" stroke-width="3"/>
      <rect x="110" y="16" width="16" height="30" rx="3" stroke="none"/>
    </g>
    <g stroke="#f43f5e" fill="#f43f5e">
      <line x1="82" y1="4" x2="82" y2="70" stroke-width="3"/>
      <rect x="74" y="24" width="16" height="34" rx="3" stroke="none"/>
      <line x1="154" y1="18" x2="154" y2="76" stroke-width="3"/>
      <rect x="146" y="34" width="16" height="26" rx="3" stroke="none"/>
    </g>
  </g>

  <!-- judul -->
  <text x="80" y="120" font-size="84" font-weight="800" fill="#eef1f6" letter-spacing="-2">₿ CryptoKu</text>
  <text x="80" y="172" font-size="30" fill="url(#acc)" font-weight="700">Harga Kripto Real-Time • Rupiah</text>
  <text x="80" y="212" font-size="22" fill="#9aa3b2">Pantau 100 koin teratas, grafik 7 hari, watchlist &amp; kalkulator.</text>

  <!-- badge live -->
  <g transform="translate(80 236)">
    <rect width="150" height="34" rx="17" fill="#22c55e" fill-opacity=".15" stroke="#22c55e" stroke-opacity=".5"/>
    <circle cx="22" cy="17" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="38" y="23" font-size="16" font-weight="700" fill="#86efac">Update tiap 60s</text>
  </g>

  <!-- chip teknologi -->
  <g>
    <rect x="300" y="236" width="118" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="359" y="259" font-size="16" fill="#fde68a" text-anchor="middle">React 18</text>
    <rect x="428" y="236" width="132" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="494" y="259" font-size="16" fill="#fed7aa" text-anchor="middle">TypeScript</text>
    <rect x="570" y="236" width="112" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="626" y="259" font-size="16" fill="#fecdd3" text-anchor="middle">Tailwind</text>
    <rect x="692" y="236" width="172" height="34" rx="17" fill="#ffffff" fill-opacity=".07" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="778" y="259" font-size="16" fill="#bae6fd" text-anchor="middle">CoinGecko API</text>
  </g>
</svg>
